<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>declaration de naissance</title>
    <link rel="shortcut icon" href="" type="image/x-icon" />
    <link rel="shortcut icon" href="img/mairie.png" type="image/x-icon">
    <link rel="stylesheet" href="styles/bootstrap.min.css" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="styles/styles.css" />
</head>

<body class="body container">

    <h1 class="text-center container">Déclaration de naissance</h1>
    <div class="container">
        <form action="" method="post">
            <div class="mb-3 p-3">
                <label for="nom" class="form-label">Nom de l'enfant:</label>
                <input type="text" class="form-control" id="nom" name="nom" required>
            </div>
            <div class="mb-3 p-3">
                <label for="prenom" class="form-label">Prénom de l'enfant:</label>
                <input type="text" class="form-control" id="prenom" name="prenom" required>
            </div>
            <div class="mb-3">
                <label for="date_naissance" class="form-label">Date de naissance:</label>
                <input type="date" class="form-control" id="date_naissance" name="date_naissance" required>
            </div>
            <div class="mb-3">
                <label for="lieu_naissance" class="form-label">Lieu de naissance:</label>
                <input type="text" class="form-control" id="lieu_naissance" name="lieu_naissance" required>
            </div>

            <div class="mb-3">
                <label for="nom_pere" class="form-label">Nom du père:</label>
                <input type="text" class="form-control" id="nom_pere" name="nom_pere" required>
                <label for="prenom_pere" class="form-label">Prénom du père:</label>
                <input type="text" class="form-control" id="prenom_pere" name="prenom_pere" required>
                <label for="contact_pere" class="form-label">Contact du père:</label>
                <input type="tel" class="form-control" id="contact_pere" name="contact_pere" required>
            </div>

            <div class="mb-3">
                <label for="nom_mere" class="form-label">Nom de la mère:</label>
                <input type="text" class="form-control" id="nom_mere" name="nom_mere" required>
                <label for="prenom_mere" class="form-label">Prénom de la mère:</label>
                <input type="text" class="form-control" id="prenom_mere" name="prenom_mere" required>
                <label for="contact_mere" class="form-label">Contact de la mère:</label>
                <input type="tel" class="form-control" id="contact_mere" name="contact_mere" required>
            </div>
            <div>

                <button type="submit" class="btn btn-primary justify-content-center">Soumettre</button>
                <button type="reset" class="btn btn-danger justify-content-center">Annuler</button>

            </div>
        </form>

        <div class="container">
            <a href="index.html" class="btn btn-warning position-absolute top-100 start-50 translate-middle">&#8629; Retour à la page de demande</a>
        </div>

</body>

</html>
